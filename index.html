<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon RPG</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Dungeon RPG</h1>

<div id="game">

    <div id="dungeon"></div>

    <div id="status">
        <div>Lv <span id="level">1</span></div>
        <div>HP <span id="hp">100</span> / 100</div>
    </div>

    <div id="message">
        ダンジョン探索開始！
    </div>

    <div id="controls">

        <button id="up">▲</button>

        <div>
            <button id="left">◀</button>
            <button id="down">▼</button>
            <button id="right">▶</button>
        </div>

    </div>

</div>

<script src="game.js"></script>

</body>
</html>
