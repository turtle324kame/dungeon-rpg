<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Monster Dungeon RPG</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>MONSTER DUNGEON</h1>

<div id="game">

    <!-- 一人称ダンジョン画面 -->
    <div id="dungeonView">

        <div id="dungeonMessage">
            地下迷宮 B1F
        </div>

        <canvas id="dungeonCanvas"></canvas>

    </div>

    <!-- プレイヤー情報 -->
    <div id="status">

        <div>
            Lv <span id="level">1</span>
        </div>

        <div>
            HP <span id="hp">100</span> / 100
        </div>

    </div>

    <!-- メッセージ -->
    <div id="message">
        ダンジョン探索開始！
    </div>

    <!-- 操作 -->
    <div id="controls">

        <div>
            <button id="turnLeft">↶</button>
            <button id="forward">▲</button>
            <button id="turnRight">↷</button>
        </div>

        <div>
            <button id="back">▼</button>
        </div>

    </div>

</div>

<script src="game.js"></script>

</body>

</html>
